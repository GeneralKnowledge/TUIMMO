[workspace]
resolver = "2"
members = [
    "crates/terminus-core",
    "crates/terminus-tui",
    "crates/terminus-protocol",
    "crates/terminus-ssh",
    "crates/coffee-world",
    "crates/coffee-server",
    "crates/coffee-sim",
    "examples/minimal-game",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.6"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
rand = "0.10"
ratatui = "0.30"
russh = "0.64"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tempfile = "3"
terminus-core = { path = "crates/terminus-core" }
terminus-protocol = { path = "crates/terminus-protocol" }
terminus-ssh = { path = "crates/terminus-ssh" }
terminus-tui = { path = "crates/terminus-tui" }
thiserror = "2.0"
tokio = { version = "1.53", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
uuid = { version = "1.26", features = ["serde", "v4"] }
coffee-server = { path = "crates/coffee-server" }
coffee-world = { path = "crates/coffee-world" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

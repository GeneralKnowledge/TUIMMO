name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: minimal-game stays independent
        run: |
          if cargo tree -p minimal-game -i coffee-world; then
            echo "minimal-game must not depend on coffee-world" >&2
            exit 1
          fi
          cargo run -p minimal-game -- --script
